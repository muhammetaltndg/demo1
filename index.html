<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aynalı Sofra: Bir Cumartesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Aynalı Sofra · Bir Cumartesi (örnek olay sürümü, demo)
   Ebeveyn, kurgusal Deniz'in evinde bir cumartesi geçirir. Evin kesiti üstte, olaylar ve seçimler altta.
   Sabahtan geceye gök rengi değişir; koridordaki ayna günün iki yarısını ayırır. */
:root{
  --bg:#E8ECEF; --paper:#FFFFFF; --ink:#1C2230; --muted:#5A6371; --line:#CED6DD; --soft:#F2F5F7;
  --eb:#1F6470; --eb-soft:#DDEDEF; --er:#8E3B5A; --er-soft:#F5E2E9;
  --cay:#B9651F; --cay-soft:#F6E6D3; --on:#FFFFFF; --focus:#2F6FD6;
  --vurgu:var(--eb); --vurgu-soft:var(--eb-soft);
  --duvar:#FBF7F1; --cati:#7C4A3A; --zemin:#C9B79C; --esya:#D9CBB6; --koyu-esya:#8A7B67;
  --serif:"Alegreya", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141920; --paper:#1C232C; --ink:#E6EBF0; --muted:#9BA6B2; --line:#2E3843; --soft:#222A34;
    --eb:#72C3CD; --eb-soft:#173A40; --er:#E994B3; --er-soft:#3F2331; --cay:#E6A15C; --cay-soft:#3B2A18;
    --on:#10161C; --focus:#8DB4FF; --duvar:#2A2F37; --cati:#5E3A30; --zemin:#4A4033; --esya:#4B4F57; --koyu-esya:#6E6658; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141920; --paper:#1C232C; --ink:#E6EBF0; --muted:#9BA6B2; --line:#2E3843; --soft:#222A34;
  --eb:#72C3CD; --eb-soft:#173A40; --er:#E994B3; --er-soft:#3F2331; --cay:#E6A15C; --cay-soft:#3B2A18;
  --on:#10161C; --focus:#8DB4FF; --duvar:#2A2F37; --cati:#5E3A30; --zemin:#4A4033; --esya:#4B4F57; --koyu-esya:#6E6658; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
.sayfa{max-width:38rem;margin:0 auto;padding:12px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Üst bilgi: saat ve günün akışı */
.ust{display:flex;justify-content:space-between;align-items:center;gap:10px}
.marka{font-family:var(--serif);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.etiket{font-family:var(--sans);font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--cay-soft);color:var(--cay)}
.puan{font-size:.9rem;font-weight:700;color:var(--cay);font-variant-numeric:tabular-nums}
.gun{display:flex;align-items:center;gap:12px}
.saat{font-family:var(--serif);font-weight:700;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;min-width:4.2ch}
.gun-bilgi{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.gun-bilgi b{font-weight:800}
.gun-bilgi span{font-size:.88rem;color:var(--muted)}
.cizgi{display:flex;gap:4px}
.cizgi i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.cizgi i.bitti{background:color-mix(in srgb, var(--vurgu) 45%, var(--line))}
.cizgi i.simdi{background:var(--vurgu)}

/* Ev kesiti */
.ev{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.ev svg{display:block;width:100%;height:auto}
.gok{transition:fill 1.2s ease}
.duvar{fill:var(--duvar)} .cati{fill:var(--cati)} .zemin{fill:var(--zemin)}
.ic-duvar{stroke:var(--koyu-esya);stroke-width:2}
.esya{fill:var(--esya)} .koyu{fill:var(--koyu-esya)}
.oda-isik{fill:var(--vurgu);opacity:0;transition:opacity .6s ease}
.oda-isik.acik{opacity:.14}
.oda-ad{font-family:var(--sans);font-size:9.5px;font-weight:700;fill:var(--muted)}
.cam{fill:url(#camRenk)}
.ayna-cam{fill:url(#aynaRenk);stroke:var(--koyu-esya);stroke-width:1.5}
.ayna-cam.parla{animation:parla 1.6s ease 2}
@keyframes parla{50%{fill:#FFFFFF}}
.figur{transition:transform 1s cubic-bezier(.45,0,.25,1), opacity .6s ease}
.figur text{font-family:var(--sans);font-size:9px;font-weight:800;text-anchor:middle;fill:var(--ink)}
.figur.yok{opacity:0}
.figur .ten{fill:#E7C3A0}
@media (prefers-reduced-motion: reduce){.figur,.gok,.oda-isik{transition:none}.ayna-cam.parla{animation:none}}

/* Olay paneli */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:1.5rem}
.panel h2:focus,.panel p:focus{outline:none}
.anlat{font-family:var(--serif);font-size:1.22rem;line-height:1.45}
.konusma{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:4px 16px 16px 16px;background:var(--soft)}
.konusma.siz{border-radius:16px 4px 16px 16px;background:var(--eb-soft);align-self:stretch}
.konusma .kim{font-weight:800;font-size:.9rem}
.konusma .soz{font-family:var(--serif);font-size:1.22rem;line-height:1.4}
.konusma.deniz .kim{color:var(--er)} .konusma.siz .kim{color:var(--eb)} .konusma.sevim .kim,.konusma.komsu .kim{color:var(--cay)}
.ic-ses{font-weight:800;font-size:1.05rem}
.oncu{font-size:1.05rem;color:var(--muted)}
.not{font-size:.9rem;color:var(--muted)}
.liste{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}

fieldset.soru{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
fieldset.soru legend{font-weight:800;font-size:1.05rem;padding:0;margin-bottom:10px}
.ipucu{font-weight:500;color:var(--muted);font-size:.92rem}
.secenekler{display:flex;flex-direction:column;gap:8px}
.secenekler.yatay{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px}
.secenekler.yatay .sec{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:10px 6px;min-height:64px;font-size:.95rem}
.sec{display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;line-height:1.35}
.sec input{accent-color:var(--vurgu);width:1.15rem;height:1.15rem;flex:none;margin:0}
.sec.secili{border-color:var(--vurgu);background:var(--vurgu-soft)}
.sec.kapali{opacity:.45;cursor:not-allowed}
.metin-alani{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea.metin-alani{min-height:84px;resize:vertical}
.alan{display:flex;flex-direction:column;gap:6px}
.alan label{font-weight:800}
.alan .sayi{font-size:.85rem;color:var(--muted);align-self:flex-end;font-variant-numeric:tabular-nums}
.onay{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--soft);cursor:pointer}
.onay input{accent-color:var(--vurgu);width:1.2rem;height:1.2rem;margin-top:2px;flex:none}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert .sec{justify-content:center;flex-direction:column;gap:4px;padding:8px 4px;min-height:56px;font-weight:800}
.likert-uclar{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:-2px}
.ifade{font-family:var(--serif);font-size:1.2rem;line-height:1.4;padding:12px 14px;border-left:4px solid var(--cay);background:var(--soft);border-radius:0 12px 12px 0}
.ikili{display:flex;flex-direction:column;gap:14px}

.kaydirici{display:flex;flex-direction:column;gap:8px}
.kaydirici output{font-family:var(--serif);font-size:2.6rem;font-weight:700;line-height:1;color:var(--cay);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--cay);height:36px}
.olcek{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.karsilastir{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.karsilastir div{border-radius:12px;padding:12px;background:var(--soft)}
.karsilastir b{display:block;font-family:var(--serif);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.karsilastir .gercek{background:var(--cay-soft)} .karsilastir .gercek b{color:var(--cay)}
.karsilastir .etiket{display:inline-block;margin-top:4px}
.cubuk{position:relative;height:14px;border-radius:7px;background:var(--line)}
.cubuk i{position:absolute;top:-5px;width:4px;height:24px;border-radius:2px;transform:translateX(-2px)}
.cubuk .t{background:var(--ink)} .cubuk .g{background:var(--cay)}

/* Deniz'in gözünden */
.gozunden{display:flex;flex-direction:column;gap:12px}
.gozunden article{padding:14px 16px;border-radius:14px;background:var(--er-soft);display:flex;flex-direction:column;gap:4px}
.gozunden h3{font-family:var(--sans);font-size:.92rem;font-weight:800;color:var(--er)}
.gozunden p{font-family:var(--serif);font-style:italic;font-size:1.2rem;line-height:1.45}

/* Gün sonu defteri */
.defter{width:100%;border-collapse:collapse;font-size:.95rem}
.defter th{text-align:left;font-weight:800;padding:8px 6px 8px 0;vertical-align:top;width:38%;color:var(--muted)}
.defter td{padding:8px 0;vertical-align:top}
.defter tr+tr th,.defter tr+tr td{border-top:1px solid var(--line)}

.kod{font-weight:800;font-size:1.35rem;letter-spacing:.06em;padding:14px;border-radius:12px;background:var(--cay-soft);text-align:center;font-variant-numeric:tabular-nums;line-height:1.5}
.kod span{white-space:nowrap}
details{font-size:.9rem;color:var(--muted)}
details pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);padding:10px;border-radius:10px;max-height:260px;overflow:auto;color:var(--ink)}
.durum-kutu{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.durum-kutu.iyi{background:var(--eb-soft)} .durum-kutu.uyari{background:var(--cay-soft)}
.soru-buyuk{font-family:var(--serif);font-size:1.55rem;line-height:1.3;font-weight:700}

.eylemler{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.btn{border:0;border-radius:14px;min-height:54px;padding:12px 20px;font-weight:800;font-size:1.05rem;background:var(--vurgu);color:var(--on)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.gec{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.95rem;padding:8px;align-self:center}
.imza{font-size:.85rem;color:var(--muted);text-align:center}

/* Çay bardakları (ayna anı) */
.bardaklar{display:block;width:100%;height:auto;max-height:150px}
.bardaklar .masa{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.bardaklar .ayna{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 6;opacity:.7}
.bardaklar .bardak{fill:color-mix(in srgb, var(--paper) 70%, transparent);stroke-width:2.5}
.bardaklar .sol .bardak,.bardaklar .sol .kasik,.bardaklar .sol .tabak{stroke:var(--eb)}
.bardaklar .sag .bardak,.bardaklar .sag .kasik,.bardaklar .sag .tabak{stroke:var(--er)}
.bardaklar .cay{fill:var(--cay);opacity:.85}
.bardaklar .tabak,.bardaklar .kasik{fill:none;stroke-width:2.5;stroke-linecap:round}
.bardaklar .seker{fill:var(--paper);stroke:var(--muted);stroke-width:1.5}
.bardaklar .ikisi{transform-box:view-box;transform-origin:160px 0;animation:ayna 1.4s cubic-bezier(.65,0,.35,1) .35s forwards}
@keyframes ayna{to{transform:scaleX(-1)}}
@media (prefers-reduced-motion: reduce){.bardaklar .ikisi{animation:none;transform:scaleX(-1)}}

@media (min-width:560px){
  .panel{padding:26px}
  .eylemler{flex-direction:row-reverse;justify-content:space-between;align-items:center}
  .eylemler .btn{min-width:12rem}
}
</style>
</head>

const temizKod = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
function karistir(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    S.karisik["eb_" + s.id] = karistir(EB_SECENEK.filter(o => o[0] !== "baska")).concat([EB_SECENEK.find(o => o[0] === "baska")]);
    S.karisik["er_" + s.id] = karistir(ER_SECENEK.filter(o => o[0] !== "baska")).concat([ER_SECENEK.find(o => o[0] === "baska")]);

}

/* ===================== PARÇALAR ===================== */
function tekSecim(yol, baslik, secenekler, opt = {}) {
  const secili = oku(yol);
  return `<fieldset class="soru"><legend>${esc(baslik)}${opt.ipucu ? ` <span class="ipucu">${esc(opt.ipucu)}</span>` : ""}</legend>
    <div class="secenekler${opt.yatay ? " yatay" : ""}"${opt.yatay ? ` style="--n:${secenekler.length}"` : ""}>${secenekler.map(([k, t]) => {
      const id = (yol + "-" + k).replace(/\./g, "-");
      return `<label class="sec${secili === k ? " secili" : ""}" for="${id}"><input type="radio" id="${id}" name="${esc(yol)}" value="${esc(k)}" data-tek="${esc(yol)}"${secili === k ? " checked" : ""}><span>${esc(t)}</span></label>`;
    }).join("")}</div></fieldset>`;
}
function cokluSecim(yol, baslik, secenekler, enFazla) {
  const secili = oku(yol + ".secim"), dolu = secili.length >= enFazla, idk = yol.replace(/\./g, "-");
  return `<fieldset class="soru"><legend>${esc(baslik)} <span class="ipucu">En fazla ${enFazla} seçenek</span></legend>
    <div class="secenekler">${secenekler.map(([k, t]) => {
      const on = secili.includes(k), kapali = dolu && !on, id = idk + "-" + k;
      return `<label class="sec${on ? " secili" : ""}${kapali ? " kapali" : ""}" for="${id}"><input type="checkbox" id="${id}" value="${esc(k)}" data-coklu="${esc(yol)}.secim"${on ? " checked" : ""}${kapali ? " disabled" : ""}><span>${esc(t)}</span></label>`;
    }).join("")}</div>
    ${secili.includes("baska") ? `<div class="alan"><label for="baska-${idk}">Kısaca yazın (isteğe bağlı)</label>
      <input class="metin-alani" type="text" id="baska-${idk}" maxlength="120" data-metin="${esc(yol)}.baska" value="${esc(oku(yol + ".baska"))}" placeholder="İsim kullanmayın"></div>` : ""}
  </fieldset>`;
}
function likert(yol, ifade) {
  const secili = oku(yol);
  return `<fieldset class="soru"><legend>${esc(ifade)}</legend>
    <div class="likert">${[1, 2, 3, 4, 5].map(n => {
      const id = yol.replace(/\./g, "-") + "-" + n, on = secili === String(n);
      return `<label class="sec${on ? " secili" : ""}" for="${id}"><input type="radio" id="${id}" name="${esc(yol)}" value="${n}" data-tek="${esc(yol)}"${on ? " checked" : ""}><span>${n}</span></label>`;

    <div class="likert-uclar" aria-hidden="true"><span>Hiç katılmıyorum</span><span>Tamamen katılıyorum</span></div></fieldset>`;
}

function onceki() {

  for (let i = S.adim - 1; i >= 0; i--) {

  if (a.kim) return `<section class="panel"><div tabindex="-1">${konusma(a.kim, typeof a.soz === "function" ? a.soz() : a.soz)}</div>${eylemler()}</section>`;
  if (a.gerek) {
    const soru = a.gerek === "eb" ? "Sizce burada sizin özür dilemeniz gerekir mi?" : "Sizce burada Deniz’in özür dilemesi gerekir mi?";
    return `<section class="panel">${onceki()}<p class="ic-ses" tabindex="-1">İçinizden geçen…</p>${tekSecim(`${a.gerek}.${a.id}.gerek`, soru, GEREK, { yatay: true })}${eylemler("Devam", true)}</section>`;
  }
  if (a.secim) {
    const soru = a.secim === "eb" ? "Ne yaparsınız?" : "Deniz’den ne beklersiniz?";
    return `<section class="panel"><p class="ic-ses" tabindex="-1">${a.secim === "eb" ? "Şimdi ne yapıyorsunuz?" : "Bu durumda Deniz’den beklentiniz ne?"}</p>${cokluSecim(`${a.secim}.${a.id}`, soru, S.karisik[a.secim + "_" + a.id], 2)}${eylemler("Seçimimi onayla", true)}</section>`;
  }
  if (a.yanit) {
    const c = S.eb[a.yanit];
    const satir = c.secim.map(k => k === "baska" ? (c.baska.trim() ? c.baska.trim() : "(Kendi bildiğiniz gibi davrandınız.)") : YANIT[a.yanit][k])

    return `<section class="panel"><div tabindex="-1">${konusma("siz", satir)}</div>${eylemler()}</section>`;
  }
  if (a.sayilir) {
    const x = SAYILIR.find(y => y.id === a.sayilir);
    return `<section class="panel">${onceki()}<p class="ic-ses" tabindex="-1">Deniz “özür dilerim” demedi.</p>${tekSecim("sayilir." + x.id, "Bunu Deniz’in özrü olarak sayar mısınız?", SAY_SEC)}${eylemler("Devam", true)}</section>`;
  }
  if (a.bencevre) {

/* ===================== GEÇERLİLİK VE İLERLEME ===================== */
function gecerli() {
  const a = adim();
  if (a.ekran === "giris") return S.aile.length >= 2 && S.onam;
  if (a.ekran === "profil") return PROFIL.every(p => S.profil[p.k]);
  if (a.ekran === "cikis") return CIKIS.every(c => S.cikis[c.id]) && !!S.cikis.ilk;
  if (a.gerek) return !!S[a.gerek][a.id].gerek;
  if (a.secim) return S[a.secim][a.id].secim.length > 0;
  if (a.sayilir) return !!S.sayilir[a.sayilir];
  if (a.bencevre) return BENCEVRE.every(b => S.bc[b.id].ben && S.bc[b.id].cevre);
  return true;
}
// Bir an geçildiyse o anın kalan adımları (seçim, konuşma balonu) atlanır.
function atlanacakMi(a) {
  if (!a) return false;
  if (a.secim && S.gecilen[a.secim + a.id]) return true;
  if (a.yanit && S.gecilen["eb" + a.yanit]) return true;
  return false;
}
function sonrakine() {
  do {
    S.adim++;
    if (S.adim >= sahne().adim.length) { S.sahne++; S.adim = 0; }
  } while (atlanacakMi(adim()));
  ciz(true);
}
function ileri() {
  const a = adim();
  if (a.ekran === "giris") S.basla = Date.now();
  if (a.tahmin !== undefined) { const t = S.tahmin[TAHMIN[a.tahmin].id]; if (!t.acik && !t.atlandi) { t.acik = true; return ciz(false); } }
  sonrakine();
}
function gec() {
  const a = adim();
  if (a.ekran === "profil") PROFIL.forEach(p => S.profil[p.k] = null);
  if (a.ekran === "cikis") { CIKIS.forEach(c => S.cikis[c.id] = null); S.cikis.ilk = null; S.cikis.dus = null; S.cikis.neden = ""; }
  if (a.gerek || a.secim) { const y = a.gerek || a.secim; S[y][a.id] = { gerek: null, secim: [], baska: "" }; S.gecilen[y + a.id] = true; }
  if (a.sayilir) S.sayilir[a.sayilir] = null;
  if (a.bencevre) BENCEVRE.forEach(b => S.bc[b.id] = { ben: null, cevre: null });
  if (a.tahmin !== undefined) { const t = S.tahmin[TAHMIN[a.tahmin].id]; t.atlandi = true; t.acik = false; }
  sonrakine();
}

/* ===================== KAYIT VE GÖNDERİM ===================== */
function sutunlar() {
  const k = ["surum", "kaynak", "aile", "sira", "baslangic", "bitis", "sure_sn"];
  PROFIL.forEach(p => k.push(p.k));
  SENARYOLAR.forEach(s => ["eb", "er"].forEach(y => k.push(`${s.id}_${y}_gerek`, `${s.id}_${y}_secim`, `${s.id}_${y}_baska`)));
  SAYILIR.forEach(x => k.push(x.id));
  BENCEVRE.forEach(b => k.push(`${b.id}_ben`, `${b.id}_cevre`));
  TAHMIN.forEach(t => k.push(`${t.id}_tahmin`, `${t.id}_gercek`, `${t.id}_puan`));
  k.push("tahmin_toplam");
  CIKIS.forEach(c => k.push(c.id));
  k.push("ilk_adim", "dusunduren", "dusunduren_neden");
  return k;
}
const iso = ms => ms ? new Date(ms).toISOString() : "";
function kayitOlustur() {
  const r = { surum: SURUM, kaynak: "cevrimici", aile: S.aile, sira: S.sira, baslangic: iso(S.basla), bitis: iso(S.bitis || Date.now()),
    sure_sn: S.basla ? Math.round(((S.bitis || Date.now()) - S.basla) / 1000) : "" };
  PROFIL.forEach(p => r[p.k] = S.profil[p.k] || "");
  SENARYOLAR.forEach(s => ["eb", "er"].forEach(y => {
    const c = S[y][s.id];
    r[`${s.id}_${y}_gerek`] = c.gerek || "";
    r[`${s.id}_${y}_secim`] = (y === "eb" ? EB_SECENEK : ER_SECENEK).map(o => o[0]).filter(k => c.secim.includes(k)).join("|");
    r[`${s.id}_${y}_baska`] = c.secim.includes("baska") ? c.baska.trim() : "";
  }));
  SAYILIR.forEach(x => r[x.id] = S.sayilir[x.id] || "");
  BENCEVRE.forEach(b => { r[`${b.id}_ben`] = S.bc[b.id].ben || ""; r[`${b.id}_cevre`] = S.bc[b.id].cevre || ""; });
  TAHMIN.forEach(t => { const x = S.tahmin[t.id], v = x.acik && !x.atlandi; r[`${t.id}_tahmin`] = v ? x.deger : ""; r[`${t.id}_gercek`] = t.gercek; r[`${t.id}_puan`] = v ? tahminPuani(t.id) : ""; });
  r.tahmin_toplam = toplamPuan();
  CIKIS.forEach(c => r[c.id] = S.cikis[c.id] || "");
  r.ilk_adim = S.cikis.ilk || ""; r.dusunduren = S.cikis.dus || ""; r.dusunduren_neden = (S.cikis.neden || "").trim();
  const sirali = {}; sutunlar().forEach(k => sirali[k] = r[k] ?? ""); return sirali;
}

/* Yedek kod: cevaplar sayılara çevrilip tek bir büyük sayıda paketlenir ve 32'lik alfabeyle yazılır.
   Bu bir gizlemedir, şifreleme değil: göz ucuyla okunmaz ama çözme mantığı bu dosyadadır. Açık uçlu yazılar koda girmez. */
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function kodAlanlari() {
  const A = [{ k: "sira", s: ["A", "B"] }];
  PROFIL.forEach(p => A.push({ k: p.k, s: p.s.map(x => x[0]) }));
  SENARYOLAR.forEach(s => {
    A.push({ k: `${s.id}_eb_gerek`, s: GEREK.map(x => x[0]) }, { k: `${s.id}_eb_secim`, c: EB_SECENEK.map(x => x[0]) });
    A.push({ k: `${s.id}_er_gerek`, s: GEREK.map(x => x[0]) }, { k: `${s.id}_er_secim`, c: ER_SECENEK.map(x => x[0]) });
  });
  SAYILIR.forEach(x => A.push({ k: x.id, s: SAY_SEC.map(y => y[0]) }));
  BENCEVRE.forEach(b => A.push({ k: `${b.id}_ben`, s: BEN.map(y => y[0]) }, { k: `${b.id}_cevre`, s: CEVRE.map(y => y[0]) }));
  TAHMIN.forEach(t => A.push({ k: `${t.id}_tahmin`, n: 101 }));
  CIKIS.forEach(c => A.push({ k: c.id, s: ["1", "2", "3", "4", "5"] }));
  A.push({ k: "ilk_adim", s: ILK.map(x => x[0]) }, { k: "dusunduren", s: DUS.map(x => x[0]) });
  return A;
}
const taban = a => a.s ? BigInt(a.s.length + 1) : a.c ? (1n << BigInt(a.c.length)) : BigInt(a.n + 1);
function sayiya(a, v) {
  if (a.s) { const i = a.s.indexOf(String(v)); return BigInt(i < 0 ? 0 : i + 1); }
  if (a.c) { let m = 0n; String(v || "").split("|").filter(Boolean).forEach(x => { const i = a.c.indexOf(x); if (i >= 0) m |= (1n << BigInt(i)); }); return m; }
  return v === "" || v == null ? 0n : BigInt(Number(v) + 1);
}
function sayidan(a, x) {
  if (a.s) return x === 0n ? "" : a.s[Number(x) - 1];
  if (a.c) return a.c.filter((_, i) => (x >> BigInt(i)) & 1n).join("|");
  return x === 0n ? "" : Number(x) - 1;
}
function govdeUzunlugu() { let p = 1n; kodAlanlari().forEach(a => p *= taban(a)); let L = 0, q = p - 1n; while (q > 0n) { q /= 32n; L++; } return Math.max(L, 1); }
function kontrolHanesi(govde, aile) { let t = 0; for (let i = 0; i < govde.length; i++) t += B32.indexOf(govde[i]) * (i + 1); for (let i = 0; i < aile.length; i++) t += aile.charCodeAt(i) * (i + 7); return B32[t % 32]; }
function kodOlustur(r) {
  let v = 0n, c = 1n;
  kodAlanlari().forEach(a => { v += sayiya(a, r[a.k]) * c; c *= taban(a); });
  let s = ""; const L = govdeUzunlugu();
  for (let i = 0; i < L; i++) { s = B32[Number(v % 32n)] + s; v /= 32n; }
  s += kontrolHanesi(s, r.aile);
  return r.aile + "-" + s.match(/.{1,4}/g).join("-");
}
function kodCoz(kod) {
  const m = String(kod).trim().toUpperCase().match(/^([A-Z0-9]{2,8})[\s\-]+(.+)$/);
  if (!m) throw new Error("Kodun başında aile kodu olmalı (örneğin K7Q2-…).");
  const aile = m[1], g = m[2].replace(/O/g, "0").replace(/[IL]/g, "1").replace(/[^0-9A-Z]/g, "");
  const L = govdeUzunlugu();
  if (g.length !== L + 1) throw new Error(`Kodda aile kodundan sonra ${L + 1} karakter olmalı; ${g.length} karakter var.`);
  const govde = g.slice(0, L);
  if (kontrolHanesi(govde, aile) !== g[L]) throw new Error("Kontrol karakteri tutmuyor; kod yanlış yazılmış olabilir.");
  let v = 0n; for (const ch of govde) { const d = B32.indexOf(ch); if (d < 0) throw new Error(`Geçersiz karakter: ${ch}`); v = v * 32n + BigInt(d); }
  const r = { surum: SURUM, kaynak: "yedek_kod", aile };
  kodAlanlari().forEach(a => { const t = taban(a); r[a.k] = sayidan(a, v % t); v /= t; });
  TAHMIN.forEach(t => { const d = r[`${t.id}_tahmin`]; r[`${t.id}_gercek`] = t.gercek; r[`${t.id}_puan`] = d === "" ? "" : puanHesap(d, t.gercek); });
  r.tahmin_toplam = TAHMIN.reduce((s, t) => s + (Number(r[`${t.id}_puan`]) || 0), 0);
  const sirali = {}; sutunlar().forEach(k => sirali[k] = r[k] ?? ""); return sirali;
}

async function gonder() {
  S.bitis = Date.now();
  const kayit = kayitOlustur();
  S.gonderim = { durum: "gidiyor", kod: kodOlustur(kayit) };
  ciz(false);
  if (!GONDERIM_ADRESI) { S.gonderim.durum = "demo"; return ciz(true); }
  try {
    const ctrl = new AbortController(), zaman = setTimeout(() => ctrl.abort(), 15000);
    // Gövde düz metin olarak gider; böylece tarayıcı ek izin isteği (preflight) yapmaz.
    const yanit = await fetch(GONDERIM_ADRESI, { method: "POST", body: JSON.stringify(kayit), signal: ctrl.signal });
    clearTimeout(zaman);
    const j = await yanit.json();
    S.gonderim.durum = j && j.ok ? "ok" : "hata";
  } catch (e) { S.gonderim.durum = "hata"; }
  ciz(true);
}

  if (el.dataset.tek) { yaz(el.dataset.tek, el.value); ciz(false); }
  else if (el.dataset.coklu) {
    const liste = oku(el.dataset.coklu), k = el.value;
    if (el.checked && !liste.includes(k)) liste.push(k);
    if (!el.checked) liste.splice(liste.indexOf(k), 1);
    ciz(false);
  }
  else if (el.hasAttribute("data-onam")) { S.onam = el.checked; devamGuncelle(); }
});
app.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.kod) { S.aile = temizKod(el.value); if (el.value !== S.aile) el.value = S.aile; devamGuncelle(); }
  else if (el.dataset.metin) { yaz(el.dataset.metin, el.value); const s = document.getElementById("neden-sayi"); if (s && el.id === "neden") s.textContent = `${el.value.length} / 200`; devamGuncelle(); }
  else if (el.dataset.sayi) { const v = Number(el.value); yaz(el.dataset.sayi, v); const o = el.parentNode.querySelector("output"); if (o) o.textContent = "%" + v; }
});
app.addEventListener("click", e => {
  const b = e.target.closest("[data-is]"); if (!b || b.disabled) return;
  if (b.dataset.is === "devam") ileri();
  else if (b.dataset.is === "gec") gec();
  else if (b.dataset.is === "gonder") gonder();
});

/* ===================== ÇÖZÜCÜ (?coz=1) =====================
   Araştırma ekibi için: kâğıtla gelen yedek kodları tabloya yapıştırılabilir satırlara çevirir. */
function cozucu() {
  document.title = "Aynalı Sofra · Kod çözücü";
  app.innerHTML = `<section class="panel">
    <h2>Yedek kod çözücü</h2>
    <p class="oncu">Kâğıtla gelen kodları her satıra bir kod gelecek şekilde yapıştırın.</p>
    <textarea class="metin-alani" id="kodlar" style="min-height:140px" placeholder="K7Q2-XXXX-XXXX-…"></textarea>
    <div class="eylemler"><button class="btn" id="coz">Kodları çöz</button></div>
    <div id="sonuc"></div>
  </section>`;
  document.getElementById("coz").onclick = () => {
    const satirlar = document.getElementById("kodlar").value.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const kayitlar = [], hatalar = [];
    satirlar.forEach((s, i) => { try { kayitlar.push(kodCoz(s)); } catch (err) { hatalar.push(`${i + 1}. satır (${s}): ${err.message}`); } });
    const k = sutunlar(), hucre = v => /[",\n;]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
    const csv = [k.join(",")].concat(kayitlar.map(r => k.map(x => hucre(r[x])).join(","))).join("\n");
    document.getElementById("sonuc").innerHTML = `
      ${hatalar.length ? `<div class="durum-kutu uyari"><b>${hatalar.length} kod çözülemedi</b>${hatalar.map(h => `<span>${esc(h)}</span>`).join("")}</div>` : ""}
      <p><b>${kayitlar.length}</b> kod çözüldü. Aşağıdaki satırları tabloya yapıştırabilirsiniz.</p>
      <textarea class="metin-alani" style="min-height:160px" readonly>${esc(csv)}</textarea>`;
  };
}



window.AynaliSofra = { kodOlustur, kodCoz, kayitOlustur, durum: () => S };
if (parametre("coz") === "1") { document.getElementById("ev").hidden = true; cozucu(); } else { evCiz(); ciz(false); }
